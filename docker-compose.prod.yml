services:
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: js-prod
    restart: unless-stopped
    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.js-router.rule=Host(`js.vps.malejka.lowicz.pl`)"
      - "traefik.http.routers.js-router.entrypoints=websecure"
      - "traefik.http.routers.js-router.tls.certresolver=myresolver"
      - "traefik.http.services.js-service.loadbalancer.server.port=80"

networks:
  proxy:
    external: true